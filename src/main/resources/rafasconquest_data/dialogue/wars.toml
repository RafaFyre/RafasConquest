joined_march = "You have joined the army of {nation} on the march; you will go with it into battle"
no_army = "Your nation has no army in the field"
no_war = "There is no war to send you to"
at_camp = "You arrive at the war camp, before the command tent. The battle for the {county} is being fought"
behind_lines = "You arrive behind your lines on the field of the {county}. You will fight with your army when it comes"

muster_bar = "{nation}'s army musters at {place}: it marches in {time}"

[war.meet]
ocean = " meet at sea, their fleets closing,"
amphibious = " meet at {fort}, {a} landing under its walls from the sea,"
