# Wars and feuds as the players hear of them.

[feud]
clash_set = "[Feud] {text} (see the map)"
skirmish = "[Feud] The men of {a} and {b} meet in a skirmish. {line}"
duel = "[Feud] {a} and {b} face each other in a duel for {lord_a} and {lord_b} ({x}, {z})."
news = "[Feud] {text}"
paid = "You paid {count} emeralds in your feud."
was_paid = "You were paid {count} emeralds in your feud."
a_lord = "a lord"

[war]
