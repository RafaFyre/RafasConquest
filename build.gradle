plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The jar is named for the build: rafasconquestPREALPHA-<mod version>.<commit it was built from>.
def commitId = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()
version = "${mod_version}.${commitId}"
group = mod_group_id

base {
    archivesName = 'rafasconquestPREALPHA'
}

// Minecraft 1.21 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run with Minecraft (and this mod) on the classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation "maven.modrinth:villager-recruits:${recruits_version}"

    // Recommended client mods: present in dev runs, but not dependencies of this mod.
    runtimeOnly "maven.modrinth:embeddium:${embeddium_version}"
    // Distant Horizons is also compiled against, to draw battles in its terrain. Only client/DistantHorizonsArmies
    // touches it, and only when it is installed.
    implementation "maven.modrinth:distanthorizons:${distant_horizons_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Regenerates the city wall structure templates from dev/WallTemplates.
tasks.register('generateWallTemplates', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rafasconquest.dev.WallTemplates'
    args file('src/main/resources/data/rafasconquest/structure/city/wall').absolutePath
}

// Renders a dev world's political map to a PNG from dev/MapPreview: gradlew mapPreview -Pworld=run/world -Pout=map.png
tasks.register('mapPreview', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rafasconquest.dev.MapPreview'
    args file(project.findProperty('world') ?: 'run/world').absolutePath, file(project.findProperty('out') ?: 'build/map-preview.png').absolutePath
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            recruits_version_range: recruits_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
