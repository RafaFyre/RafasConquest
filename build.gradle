plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The jar is named for the build: rafasconquestPREALPHA-<mod version>.<commit it was built from>.
def commitId = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()
version = "${mod_version}.${commitId}"
group = mod_group_id

base {
    archivesName = 'rafasconquestPREALPHA'
}

// Minecraft 1.21 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run with Minecraft (and this mod) on the classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'FirstDark'
                url = 'https://maven.firstdark.dev/snapshots'
            }
        }
        filter { includeGroup 'com.lowdragmc.ldlib2' }
    }
}

dependencies {
    implementation "maven.modrinth:villager-recruits:${recruits_version}"

    // Recommended client mods: present in dev runs, but not dependencies of this mod.
    // Sodium, not Embeddium: Veil (inside Sable) refuses to load next to Embeddium.
    runtimeOnly "maven.modrinth:sodium:${sodium_version}"
    runtimeOnly "maven.modrinth:epic-knights-shields-armor-and-weapons:${epic_knights_version}"
    runtimeOnly "maven.modrinth:epic-knights-antique-legacy:${antique_legacy_version}"
    runtimeOnly "maven.modrinth:architectury-api:${architectury_version}"
    runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    runtimeOnly "maven.modrinth:musket-mod:${musket_version}"
    // Siegeworks (CurseForge only): the siege train's engines, worked by Recruits' siege engineers. Needs Axiomata and GeckoLib.
    runtimeOnly "curse.maven:siegeworks-1713906:${siegeworks_file}"
    runtimeOnly "curse.maven:axiomata-1713796:${axiomata_file}"
    runtimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    // Compiled against only for the Mounted Light Cannon's client mixin (FieldGunMountedMixin); still optional at runtime.
    compileOnly "curse.maven:siegeworks-1713906:${siegeworks_file}"
    compileOnly "curse.maven:axiomata-1713796:${axiomata_file}"
    compileOnly "maven.modrinth:geckolib:${geckolib_version}"
    // Sable is also compiled against, to sail real ships on the sea lanes; only bridge/SableShips touches it, and only
    // when it is installed. Its pose and box types are in a companion jar nested inside it.
    implementation "maven.modrinth:sable:${sable_version}"
    def sableJar = configurations.detachedConfiguration(dependencies.create("maven.modrinth:sable:${sable_version}")).singleFile
    compileOnly zipTree(sableJar).matching { include 'META-INF/jarjar/sable-companion-common-*.jar' }
    runtimeOnly "maven.modrinth:photon-editor:${photon_version}"
    runtimeOnly "maven.modrinth:kilagraph:${kilagraph_version}"
    // LDLib2 is not on Modrinth. The -all jar bundles its own libraries.
    runtimeOnly("com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${ldlib2_version}:all") { transitive = false }
    // Distant Horizons is also compiled against, to draw battles in its terrain. Only client/DistantHorizonsArmies
    // touches it, and only when it is installed.
    implementation "maven.modrinth:distanthorizons:${distant_horizons_version}"
    // Turbo for Distant Horizons (CurseForge only): faster LOD building, as in the game instance.
    runtimeOnly "curse.maven:turbo-for-distant-horizons-1734835:${dh_turbo_file}"
    // Curios is also compiled against, for the cape slot. Only client/CapeCurio touches it, and only when it is installed.
    implementation "maven.modrinth:curios:${curios_version}"
    // Better Combat is only compiled against, for halberd and glaive swing modes. Only bridge/SwingModes touches it,
    // and only when it is installed. Not in dev runs: it needs Player Animator and Cloth Config there.
    compileOnly "maven.modrinth:better-combat:${better_combat_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Regenerates the city wall structure templates from dev/WallTemplates.
tasks.register('generateWallTemplates', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rafasconquest.dev.WallTemplates'
    args file('src/main/resources/data/rafasconquest/structure/city/wall').absolutePath
}

// Renders a dev world's political map to a PNG from dev/MapPreview: gradlew mapPreview -Pworld=run/world -Pout=map.png
tasks.register('mapPreview', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rafasconquest.dev.MapPreview'
    args file(project.findProperty('world') ?: 'run/world').absolutePath, file(project.findProperty('out') ?: 'build/map-preview.png').absolutePath
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            recruits_version_range: recruits_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
